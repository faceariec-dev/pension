name: Deploy na Forpsi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Repozitářová proměnná (Settings → Variables). Pro testovací podsložku např. /test, pro ostrý web nenastavovat.
          SITE_BASE: ${{ vars.SITE_BASE }}

      - name: Připravit SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Nahrát web (rsync po SSH, jinak SFTP přes lftp; bez mazání cizích souborů)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: |
          PORT="${PORT:-22}"
          SSHOPTS="-i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes"
          # Test v podsložce: kořenový .htaccess nenahrávat (přesměrování by mířila na kořen domény).
          SKIP_HTACCESS=0
          if [ -n "$SITE_BASE" ]; then SKIP_HTACCESS=1; fi

          # Zkouška přihlášení klíčem. Odmítnutý klíč = chyba hned; jiné selhání (třeba jen SFTP bez shellu) = SFTP.
          if ssh $SSHOPTS "$USER@$HOST" "rsync --version" >/tmp/probe.out 2>/tmp/probe.err; then HAS_RSYNC=1; else HAS_RSYNC=0; fi
          if grep -qi "permission denied" /tmp/probe.err; then
            echo "::error::Server odmítl SSH klíč (Permission denied). Zkontrolujte: veřejný klíč nahraný v administraci Forpsi (SSH), SSH_USER, SSH_PORT a formát SSH_PRIVATE_KEY (OpenSSH, celý, včetně BEGIN/END)."
            cat /tmp/probe.err
            exit 1
          fi
          cat /tmp/probe.err || true

          if [ "$HAS_RSYNC" = 1 ]; then
            echo "Nahrávám přes rsync"
            EXTRA=''
            if [ "$SKIP_HTACCESS" = 1 ]; then EXTRA="--exclude=/.htaccess"; fi
            # 1) Soubory webu. Bez --delete: nic mimo web (WordPress, poptavka-config.php) se nemaže ani nepřepisuje.
            rsync -rltvz --checksum --exclude='poptavka-config*.php' $EXTRA -e "ssh $SSHOPTS" dist/ "$USER@$HOST:$TARGET/"
            # 2) Jen složka _astro (hashované soubory webu): staré verze se smažou.
            rsync -rltvz --checksum --delete -e "ssh $SSHOPTS" dist/_astro/ "$USER@$HOST:$TARGET/_astro/"
          else
            echo "rsync na serveru není, nahrávám přes SFTP (lftp)"
            sudo apt-get update -qq && sudo apt-get install -y -qq lftp
            EXCL="--exclude-glob poptavka-config*.php"
            if [ "$SKIP_HTACCESS" = 1 ]; then EXCL="$EXCL --exclude ^\\.htaccess$"; fi
            lftp -e "set sftp:connect-program 'ssh $SSHOPTS'; set cmd:fail-exit yes; set net:max-retries 3; open -p $PORT -u \"$USER,x\" sftp://$HOST; mirror -R --parallel=4 $EXCL dist/ $TARGET/; mirror -R --delete --parallel=4 dist/_astro $TARGET/_astro; bye"
          fi
