name: Deploy na Forpsi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Repozitářová proměnná (Settings → Variables). Pro testovací podsložku např. /test, pro ostrý web nenastavovat.
          SITE_BASE: ${{ vars.SITE_BASE }}

      - name: Připravit SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Nahrát web (rsync přes SSH, bez mazání cizích souborů)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${PORT:-22} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # Test v podsložce: kořenový .htaccess nenahrávat (přesměrování by mířila na kořen domény).
          EXTRA=''
          if [ -n "$SITE_BASE" ]; then EXTRA="--exclude=/.htaccess"; fi
          # 1) Soubory webu. Bez --delete: nic mimo web (WordPress, poptavka-config.php) se nemaže ani nepřepisuje.
          rsync -rltvz --checksum --exclude='poptavka-config*.php' $EXTRA -e "$SSH" dist/ "$USER@$HOST:$TARGET/"
          # 2) Jen složka _astro (hashované soubory webu): staré verze se smažou.
          rsync -rltvz --checksum --delete -e "$SSH" dist/_astro/ "$USER@$HOST:$TARGET/_astro/"
